<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Clip - Clipboard History</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: rgba(30, 30, 30, 0.95);
            color: white;
            backdrop-filter: blur(10px);
            height: 100vh;
            overflow: hidden;
        }
        
        .header {
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .title {
            font-size: 14px;
            font-weight: 600;
        }
        
        .search-box {
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 12px;
            width: 200px;
        }
        
        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .clipboard-list {
            height: calc(100vh - 60px);
            overflow-y: auto;
            padding: 5px;
        }
        
        .clipboard-item {
            background: rgba(255, 255, 255, 0.05);
            margin: 5px 0;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }
        
        .clipboard-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(100, 150, 255, 0.5);
        }
        
        .item-content {
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 5px;
            max-height: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .item-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .item-type {
            background: rgba(100, 150, 255, 0.3);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
        }
        
        .item-tags {
            display: flex;
            gap: 4px;
        }
        
        .tag {
            background: rgba(255, 100, 100, 0.3);
            padding: 2px 4px;
            border-radius: 2px;
            font-size: 9px;
        }
        
        .no-items {
            text-align: center;
            padding: 50px 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">📋 Clipboard History</div>
        <input type="text" class="search-box" placeholder="Search clipboard..." id="searchBox">
    </div>
    
    <div class="clipboard-list" id="clipboardList">
        <div class="no-items">
            No clipboard entries yet.<br>
            Start copying text and it will appear here!
        </div>
    </div>

    <script>
        const { clipboard } = require('electron');
        const axios = require('axios');
        
        const API_BASE = 'http://127.0.0.1:8000';
        let clipboardEntries = [];
        
        // Load clipboard history
        async function loadClipboardHistory() {
            try {
                const response = await axios.get(`${API_BASE}/api/clipboard`);
                clipboardEntries = response.data;
                renderClipboardList(clipboardEntries);
            } catch (error) {
                console.error('Failed to load clipboard history:', error);
                document.getElementById('clipboardList').innerHTML = 
                    '<div class="no-items">Failed to connect to backend.<br>Make sure the FastAPI server is running.</div>';
            }
        }
        
        // Render clipboard list
        function renderClipboardList(entries) {
            const listElement = document.getElementById('clipboardList');
            
            if (entries.length === 0) {
                listElement.innerHTML = '<div class="no-items">No clipboard entries found.</div>';
                return;
            }
            
            listElement.innerHTML = entries.map(entry => `
                <div class="clipboard-item" onclick="selectClipboardItem('${entry.id}', '${escapeHtml(entry.content)}')">
                    <div class="item-content">${escapeHtml(entry.content)}</div>
                    <div class="item-meta">
                        <div>
                            <span class="item-type">${entry.type}</span>
                            <span class="item-tags">
                                ${entry.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                            </span>
                        </div>
                        <div>${formatTime(entry.timestamp)}</div>
                    </div>
                </div>
            `).join('');
        }
        
        // Select clipboard item and copy to clipboard
        function selectClipboardItem(id, content) {
            clipboard.writeText(content);
            console.log('Copied to clipboard:', content.substring(0, 50) + '...');
            
            // Hide window after selection
            const { remote } = require('electron');
            const currentWindow = remote.getCurrentWindow();
            currentWindow.hide();
        }
        
        // Search functionality
        document.getElementById('searchBox').addEventListener('input', async (e) => {
            const query = e.target.value.trim();
            
            if (query === '') {
                renderClipboardList(clipboardEntries);
                return;
            }
            
            try {
                const response = await axios.get(`${API_BASE}/api/clipboard/search?q=${encodeURIComponent(query)}`);
                renderClipboardList(response.data);
            } catch (error) {
                console.error('Search failed:', error);
            }
        });
        
        // Utility functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
            return date.toLocaleDateString();
        }
        
        // Load data when window opens
        window.addEventListener('DOMContentLoaded', () => {
            loadClipboardHistory();
            
            // Refresh every 5 seconds
            setInterval(loadClipboardHistory, 5000);
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const { remote } = require('electron');
                const currentWindow = remote.getCurrentWindow();
                currentWindow.hide();
            }
        });
    </script>
</body>
</html>
