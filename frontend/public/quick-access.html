<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Clip - Quick Access</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: rgba(30, 30, 30, 0.95);
            color: white;
            backdrop-filter: blur(10px);
            height: 100vh;
            overflow: hidden;
        }
        
        .header {
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .title {
            font-size: 14px;
            font-weight: 600;
        }
        
        .search-box {
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 12px;
            width: 200px;
        }
        
        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .clipboard-list {
            height: calc(100vh - 60px);
            overflow-y: auto;
            padding: 5px;
        }
        
        .clipboard-item {
            background: rgba(255, 255, 255, 0.05);
            margin: 5px 0;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }
        
        .clipboard-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(100, 150, 255, 0.5);
        }
        
        .item-content {
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 5px;
            max-height: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .item-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .item-type {
            background: rgba(100, 150, 255, 0.3);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
        }
        
        .item-tags {
            display: flex;
            gap: 4px;
        }
        
        .tag {
            background: rgba(255, 100, 100, 0.3);
            padding: 2px 4px;
            border-radius: 2px;
            font-size: 9px;
        }
        
        .no-items {
            text-align: center;
            padding: 50px 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">📋 Quick Access</div>
        <input type="text" class="search-box" placeholder="Search clipboard..." id="searchBox">
    </div>
    
    <div class="clipboard-list" id="clipboardList">
        <div class="no-items">
            No clipboard entries yet.<br>
            Start copying text and it will appear here!
        </div>
    </div>

    <script src="../src/renderer/quick-access.js"></script>
</body>
</html>
